# The image built from these sources, with an Xtream Codes account.
# For the published image, see the README (Quick start).
services:
  iptv-proxy:
    build: .
    container_name: iptv-proxy
    restart: unless-stopped
    ports:
      # the same port as PORT below
      - 8080:8080
    environment:
      # An Xtream Codes account...
      XTREAM_BASE_URL: "http://provider.example:8080"
      XTREAM_USER: xtream_user
      XTREAM_PASSWORD: xtream_password
      # ...or an M3U playlist instead (an address, or a file in ./iptv):
      # M3U_URL: /iptv/iptv.m3u
      PORT: 8080
      # Name or IP your players reach this machine at
      PROXY_HOSTNAME: 192.168.1.10
      # What your players log in with: change both
      PROXY_USER: family
      PROXY_PASSWORD: choose-a-password
    # volumes:
    #   - ./iptv:/iptv:ro
