version: 2

project_name: iptv-proxy

builds:
  - binary: iptv-proxy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - windows
      - darwin
      - linux

    goarch:
      - amd64
      - arm64

archives:
  -
   format_overrides:
     - goos: windows
       formats: [zip]

release:
  github:
    owner: pierre-emmanuelJ
    name: iptv-proxy
  draft: false

nfpms:
  -
   vendor: Pierre-Emmanuel Jacquier
   homepage: https://github.com/pierre-emmanuelJ/iptv-proxy
   maintainer: Pierre-Emmanuel <pierre-emmanuel.jacquier@epitech.eu>
   description: Reverse proxy on iptv m3u file
   license: GPL-3.0
   formats:
     - deb
     - rpm

dockers:
  - image_templates:
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:{{ .Tag }}-arm64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:v{{ .Major }}-arm64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:v{{ .Major }}.{{ .Minor }}-arm64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:latest-arm64"
    - "pierro777/iptv-proxy:{{ .Tag }}-arm64"
    - "pierro777/iptv-proxy:v{{ .Major }}-arm64"
    - "pierro777/iptv-proxy:v{{ .Major }}.{{ .Minor }}-arm64"
    - "pierro777/iptv-proxy:latest-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    ids:
    - iptv-proxy
    build_flag_templates:
    - "--platform=linux/arm64/v8"
    - "--label=org.opencontainers.image.created={{.Date}}"
    - "--label=org.opencontainers.image.name={{.ProjectName}}"
    - "--label=org.opencontainers.image.revision={{.FullCommit}}"
    - "--label=org.opencontainers.image.version={{.Version}}"
    skip_push: false
    dockerfile: .Dockerfile.goreleaser

  - image_templates:
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:{{ .Tag }}-amd64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:v{{ .Major }}-amd64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:v{{ .Major }}.{{ .Minor }}-amd64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:latest-amd64"
    - "pierro777/iptv-proxy:{{ .Tag }}-amd64"
    - "pierro777/iptv-proxy:v{{ .Major }}-amd64"
    - "pierro777/iptv-proxy:v{{ .Major }}.{{ .Minor }}-amd64"
    - "pierro777/iptv-proxy:latest-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    ids:
    - iptv-proxy
    build_flag_templates:
    - "--platform=linux/amd64"
    - "--label=org.opencontainers.image.created={{.Date}}"
    - "--label=org.opencontainers.image.name={{.ProjectName}}"
    - "--label=org.opencontainers.image.revision={{.FullCommit}}"
    - "--label=org.opencontainers.image.version={{.Version}}"
    skip_push: false
    dockerfile: .Dockerfile.goreleaser

  # The -ffmpeg images: the same, with ffmpeg for the HDHomeRun tuner's HLS
  # channels.
  - image_templates:
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:{{ .Tag }}-ffmpeg-arm64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:v{{ .Major }}-ffmpeg-arm64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:v{{ .Major }}.{{ .Minor }}-ffmpeg-arm64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:latest-ffmpeg-arm64"
    - "pierro777/iptv-proxy:{{ .Tag }}-ffmpeg-arm64"
    - "pierro777/iptv-proxy:v{{ .Major }}-ffmpeg-arm64"
    - "pierro777/iptv-proxy:v{{ .Major }}.{{ .Minor }}-ffmpeg-arm64"
    - "pierro777/iptv-proxy:latest-ffmpeg-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    ids:
    - iptv-proxy
    build_flag_templates:
    - "--platform=linux/arm64/v8"
    - "--target=ffmpeg"
    - "--label=org.opencontainers.image.created={{.Date}}"
    - "--label=org.opencontainers.image.name={{.ProjectName}}"
    - "--label=org.opencontainers.image.revision={{.FullCommit}}"
    - "--label=org.opencontainers.image.version={{.Version}}"
    skip_push: false
    dockerfile: .Dockerfile.goreleaser

  - image_templates:
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:{{ .Tag }}-ffmpeg-amd64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:v{{ .Major }}-ffmpeg-amd64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:v{{ .Major }}.{{ .Minor }}-ffmpeg-amd64"
    - "ghcr.io/pierre-emmanuelj/iptv-proxy:latest-ffmpeg-amd64"
    - "pierro777/iptv-proxy:{{ .Tag }}-ffmpeg-amd64"
    - "pierro777/iptv-proxy:v{{ .Major }}-ffmpeg-amd64"
    - "pierro777/iptv-proxy:v{{ .Major }}.{{ .Minor }}-ffmpeg-amd64"
    - "pierro777/iptv-proxy:latest-ffmpeg-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    ids:
    - iptv-proxy
    build_flag_templates:
    - "--platform=linux/amd64"
    - "--target=ffmpeg"
    - "--label=org.opencontainers.image.created={{.Date}}"
    - "--label=org.opencontainers.image.name={{.ProjectName}}"
    - "--label=org.opencontainers.image.revision={{.FullCommit}}"
    - "--label=org.opencontainers.image.version={{.Version}}"
    skip_push: false
    dockerfile: .Dockerfile.goreleaser

# The usual tags name both architectures: Docker pulls the one of the host.
docker_manifests:
  - name_template: "pierro777/iptv-proxy:{{ .Tag }}"
    image_templates:
      - "pierro777/iptv-proxy:{{ .Tag }}-amd64"
      - "pierro777/iptv-proxy:{{ .Tag }}-arm64"
  - name_template: "pierro777/iptv-proxy:v{{ .Major }}"
    image_templates:
      - "pierro777/iptv-proxy:v{{ .Major }}-amd64"
      - "pierro777/iptv-proxy:v{{ .Major }}-arm64"
  - name_template: "pierro777/iptv-proxy:v{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "pierro777/iptv-proxy:v{{ .Major }}.{{ .Minor }}-amd64"
      - "pierro777/iptv-proxy:v{{ .Major }}.{{ .Minor }}-arm64"
  - name_template: "pierro777/iptv-proxy:latest"
    image_templates:
      - "pierro777/iptv-proxy:latest-amd64"
      - "pierro777/iptv-proxy:latest-arm64"
  - name_template: "ghcr.io/pierre-emmanuelj/iptv-proxy:{{ .Tag }}"
    image_templates:
      - "ghcr.io/pierre-emmanuelj/iptv-proxy:{{ .Tag }}-amd64"
      - "ghcr.io/pierre-emmanuelj/iptv-proxy:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/pierre-emmanuelj/iptv-proxy:v{{ .Major }}"
