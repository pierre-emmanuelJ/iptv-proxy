name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Formatting
      run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
    - name: ffmpeg, for the tests of the tuner's HLS channels
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
    - name: Tests
      run: go test -race -count=1 -coverprofile=coverage.out ./...
    - name: Coverage of the packages
      run: |
        go tool cover -func=coverage.out | tail -1
        # every package that has tests keeps at least 80% of its statements covered
        go test -count=1 -cover ./... | awk '/^ok/ && match($0, /coverage: [0-9.]+%/) { pct = substr($0, RSTART + 10, RLENGTH - 11); if (pct + 0 < 80) { print "under 80%: " $2 " (" pct "%)"; bad = 1 } } END { exit bad }'
    - name: Fuzz the playlist and guide readers
      run: |
        go test ./pkg/m3u/ -run '^$' -fuzz FuzzParse -fuzztime 30s
        go test ./pkg/hls/ -run '^$' -fuzz FuzzRewrite -fuzztime 30s
        go test ./pkg/m3u/ -run '^$' -fuzz FuzzEditAttributes -fuzztime 30s
        go test ./pkg/xmltv/ -run '^$' -fuzz FuzzFilter -fuzztime 30s
        go test ./pkg/xtream/ -run '^$' -fuzz FuzzRewriteValues -fuzztime 30s
        go test ./pkg/xtream/ -run '^$' -fuzz FuzzMergeList -fuzztime 30s
    - name: Build
      run: go build ./...
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag iptv-proxy:ci-build
    - name: Build the image with ffmpeg
      run: |
        docker build . --file Dockerfile --target ffmpeg --tag iptv-proxy:ci-build-ffmpeg
        docker run --rm --entrypoint ffmpeg iptv-proxy:ci-build-ffmpeg -hide_banner -version
