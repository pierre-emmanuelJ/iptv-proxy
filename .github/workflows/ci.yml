name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Formatting
      run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
    - name: Tests
      run: go test -race -count=1 -coverprofile=coverage.out ./...
    - name: Coverage of the packages
      run: |
        go tool cover -func=coverage.out | tail -1
        total=$(go test -count=1 -cover ./pkg/... | awk '/coverage:/ { gsub("%","",$5); if ($5+0 < 80) bad=1 } END { print bad+0 }')
        test "$total" = "0" || { echo "a package is under 80% coverage"; exit 1; }
    - name: Fuzz the playlist reader
      run: go test ./pkg/m3u/ -run '^$' -fuzz FuzzParse -fuzztime 30s
    - name: Build
      run: go build ./...
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag iptv-proxy:ci-build
