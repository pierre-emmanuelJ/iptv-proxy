version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        # The proxy's job is to request the addresses of its configured
        # provider, and to read the playlist file it is given.
        - G107
        - G304
        - G704
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, errcheck]
