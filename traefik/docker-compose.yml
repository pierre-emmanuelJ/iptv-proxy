# iptv-proxy behind Traefik, with a Let's Encrypt certificate. See the README
# (Behind a reverse proxy, with HTTPS).
services:
  iptv-proxy:
    build: .
    container_name: iptv-proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iptv-proxy.rule=Host(`iptv.proxyexample.xyz`)"
      - "traefik.http.routers.iptv-proxy.entrypoints=websecure"
      - "traefik.http.routers.iptv-proxy.tls.certresolver=letsencrypt"
      - "traefik.http.services.iptv-proxy.loadbalancer.server.port=8080"
    environment:
      # An Xtream Codes account...
      XTREAM_BASE_URL: "http://provider.example:8080"
      XTREAM_USER: xtream_user
      XTREAM_PASSWORD: xtream_password
      # ...or an M3U playlist instead (an address, or a file in ./iptv):
      # M3U_URL: /iptv/iptv.m3u
      PORT: 8080
      # The addresses the proxy gives out: your domain, over HTTPS
      PROXY_HOSTNAME: iptv.proxyexample.xyz
      ADVERTISED_PORT: 443
      HTTPS: 1
      # What your players log in with: change both
      PROXY_USER: family
      PROXY_PASSWORD: choose-a-password
    # volumes:
    #   - ./iptv:/iptv:ro

  traefik:
    image: traefik:v3
    restart: unless-stopped
    read_only: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./Traefik/traefik.yaml:/traefik.yaml:ro
      - ./Traefik/etc/traefik:/etc/traefik/
      - ./Traefik/log:/var/log/traefik/
